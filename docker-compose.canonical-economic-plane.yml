name: futuros-canonical-economic-plane

services:
  canonical-economic-evidence-plane:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ${FUTUROS_RUNTIME_DATA_ROOT}:/app/data
      - "${FUTUROS_WQ6_EVIDENCE_ROOT}:/app/data/research/frozen_wq6:ro"
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command:
      - python
      - scripts/run_canonical_economic_evidence_plane_v1.py
      - --project-root
      - /app
      - --data-root
      - /app/data
      - --output-dir
      - /app/data/reports/canonical_economic_plane
      - --write
      - --daemon
      - --interval-seconds
      - ${FUTUROS_ECONOMIC_PLANE_INTERVAL_SECONDS:-900}
      - --json
    healthcheck:
      test:
        - CMD
        - python
        - scripts/canonical_economic_evidence_plane_healthcheck_v1.py
        - --report
        - /app/data/reports/canonical_economic_plane/canonical_economic_evidence_plane_v1.json
        - --max-age-seconds
        - "1200"
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
