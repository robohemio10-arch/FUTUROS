name: Temporary materialize Qlib V2 challenger

on:
  push:
    branches:
      - codex/qlib-long-economic-policy-challenger-v2
    paths:
      - .github/_v2_code_payload.b64
      - .github/workflows/_temporary_materialize_qlib_v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Materialize frozen V2 source package
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/_v2_code_payload.b64 | tar -xz
          sha256sum \
            docs/QLIB_LONG_ECONOMIC_POLICY_CHALLENGER_V2.md \
            scripts/build_qlib_long_economic_policy_challenger_v2.py \
            smartcrypto/learning/paper_autolearning/qlib_long_economic_policy_challenger_v2.py \
            tests/test_qlib_long_economic_policy_challenger_v2.py

      - name: Remove temporary transport and stage canonical files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/_v2_code_payload.b64
          git rm .github/workflows/_temporary_materialize_qlib_v2.yml
          git add \
            docs/QLIB_LONG_ECONOMIC_POLICY_CHALLENGER_V2.md \
            scripts/build_qlib_long_economic_policy_challenger_v2.py \
            smartcrypto/learning/paper_autolearning/qlib_long_economic_policy_challenger_v2.py \
            tests/test_qlib_long_economic_policy_challenger_v2.py

      - name: Install deterministic project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Regenerate deterministic manifest and validate V2
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_project_manifest.py
          git add PROJECT_MANIFEST_CLEAN.json
          python scripts/generate_project_manifest.py --check
          python -m compileall -q scripts smartcrypto tests
          pytest -q tests/test_qlib_long_economic_policy_challenger_v2.py
          git diff --cached --check

      - name: Commit canonical V2 package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Adiciona challenger econômico Qlib V2 long-eligible"
          git push origin HEAD:codex/qlib-long-economic-policy-challenger-v2
