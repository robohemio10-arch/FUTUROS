name: AIBOT Paper AB Soak Manifest Finalize Temp

on:
  push:
    branches:
      - codex/aibot-parity-paper-ab-soak-v1

permissions:
  contents: write

jobs:
  finalize-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/aibot-parity-paper-ab-soak-v1
          fetch-depth: 0
      - name: Regenerate canonical manifest without helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aibot_paper_ab_soak_manifest_finalize_temp.yml
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json --check
          git add PROJECT_MANIFEST_CLEAN.json
          git diff --cached --check
          git commit -m "Atualiza manifesto canonico do Paper A/B soak"
          git push origin HEAD:codex/aibot-parity-paper-ab-soak-v1
