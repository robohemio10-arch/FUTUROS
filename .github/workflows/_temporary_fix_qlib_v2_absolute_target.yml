name: Temporary fix Qlib V2 absolute target

on:
  push:
    branches:
      - codex/qlib-v2-absolute-target-decoupling-fix-v1
    paths:
      - .github/workflows/_temporary_fix_qlib_v2_absolute_target.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Refactor target preparation and add regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temporary_fix_qlib_v2_absolute_target.yml
          python - <<'PY'
          from pathlib import Path

          base_path = Path("smartcrypto/learning/paper_autolearning/qlib_market_context_economic_challenger.py")
          base_text = base_path.read_text(encoding="utf-8")

          old_import = "from typing import Any, Iterator, Protocol"
          new_import = "from typing import Any, Callable, Iterator, Protocol"
          if base_text.count(old_import) != 1:
              raise SystemExit("unexpected_typing_import_shape")
          base_text = base_text.replace(old_import, new_import, 1)

          old_signature = '''def _prepare_fold(
              *,
              prior_rows: Sequence[Mapping[str, Any]],
              test_rows: Sequence[Mapping[str, Any]],
              stress_bps: float,
          ) -> tuple[PreparedFold | None, list[str]]:'''
          new_signature = '''def _prepare_fold(
              *,
              prior_rows: Sequence[Mapping[str, Any]],
              test_rows: Sequence[Mapping[str, Any]],
              stress_bps: float,
              target_builder: Callable[[Mapping[str, Any], float], float] | None = None,
              target_error_reason: str = "non_finite_training_matrix",
          ) -> tuple[PreparedFold | None, list[str]]:'''
          if base_text.count(old_signature) != 1:
              raise SystemExit("unexpected_prepare_fold_signature")
          base_text = base_text.replace(old_signature, new_signature, 1)

          old_target = '''    target = np.asarray(
                  [_stressed_return_bps(row, stress_bps) for row in fit_rows],
                  dtype=float,
              )'''
          new_target = '''    build_target = target_builder or _stressed_return_bps
              target = np.asarray(
                  [build_target(row, stress_bps) for row in fit_rows],
                  dtype=float,
              )'''
          if base_text.count(old_target) != 1:
              raise SystemExit("unexpected_target_builder_block")
          base_text = base_text.replace(old_target, new_target, 1)

          old_finite = '''    if not np.isfinite(train_x.to_numpy()).all() or not np.isfinite(target).all():
                  return None, ["non_finite_training_matrix"]
              if not np.isfinite(calibration_x.to_numpy()).all():'''
          new_finite = '''    if not np.isfinite(train_x.to_numpy()).all():
                  return None, ["non_finite_training_matrix"]
              if not np.isfinite(target).all():
                  return None, [target_error_reason]
              if not np.isfinite(calibration_x.to_numpy()).all():'''
          if base_text.count(old_finite) != 1:
              raise SystemExit("unexpected_non_finite_guard_block")
          base_text = base_text.replace(old_finite, new_finite, 1)
          base_path.write_text(base_text, encoding="utf-8")

          v2_path = Path("smartcrypto/learning/paper_autolearning/qlib_long_economic_policy_challenger_v2.py")
          v2_text = v2_path.read_text(encoding="utf-8")
          start = v2_text.index("\ndef _prepare_fold(")
          end = v2_text.index("\ndef _select_calibration_threshold(", start)
          replacement = '''
          def _prepare_fold(
              *,
              prior_rows: Sequence[Mapping[str, Any]],
              test_rows: Sequence[Mapping[str, Any]],
              stress_bps: float,
          ) -> tuple[base.PreparedFold | None, list[str]]:
              """Prepare V2 folds without ever constructing the obsolete per-notional label."""

              prepared, blockers = base._prepare_fold(
                  prior_rows=prior_rows,
                  test_rows=test_rows,
                  stress_bps=stress_bps,
                  target_builder=base._stressed_pnl,
                  target_error_reason="non_finite_absolute_stressed_pnl_target",
              )
              if prepared is None:
                  return None, blockers
              return prepared, []

          '''
          v2_text = v2_text[:start] + replacement + v2_text[end + 1:]
          v2_path.write_text(v2_text, encoding="utf-8")

          test_path = Path("tests/test_qlib_long_economic_policy_challenger_v2.py")
          test_text = test_path.read_text(encoding="utf-8")
          marker = "def test_v2_missing_notional_within_allowed_coverage_uses_absolute_target_without_crash"
          if marker not in test_text:
              test_text += '''


def test_v2_missing_notional_within_allowed_coverage_uses_absolute_target_without_crash() -> None:
    market, rows = _market_and_rows()
    for row in rows[::30]:
        row.pop("notional", None)
        row.pop("quantity", None)

    observed_targets: list[np.ndarray] = []

    def predictor(
        train_x: pd.DataFrame,
        train_y: pd.Series,
        calibration_x: pd.DataFrame,
        test_x: pd.DataFrame,
        *,
        fold_id: str,
    ) -> tuple[np.ndarray, np.ndarray]:
        del train_x, fold_id
        observed_targets.append(train_y.to_numpy(dtype=float).copy())
        return _long_signal_with_short_boost(
            pd.DataFrame(),
            pd.Series(dtype=float),
            calibration_x,
            test_x,
            fold_id="ignored",
        )

    report = build_qlib_long_economic_policy_challenger_v2(
        project_root=Path("."),
        rows=rows,
        market_rows=market,
        additional_execution_stress_bps=0.0,
        predictor=predictor,
    )

    assert report["target"] == TARGET_NAME
    assert report["predictor_mode"] == "injected_test_double"
    assert observed_targets
    assert all(np.isfinite(target).all() for target in observed_targets)
    assert report["reason"] != "native_qlib_lgb_unavailable_or_failed"
'''
          test_path.write_text(test_text, encoding="utf-8")
          PY

          python scripts/generate_project_manifest.py
          git add PROJECT_MANIFEST_CLEAN.json \
            smartcrypto/learning/paper_autolearning/qlib_market_context_economic_challenger.py \
            smartcrypto/learning/paper_autolearning/qlib_long_economic_policy_challenger_v2.py \
            tests/test_qlib_long_economic_policy_challenger_v2.py
          python scripts/generate_project_manifest.py --check
          python -m compileall -q smartcrypto tests
          pytest -q tests/test_qlib_long_economic_policy_challenger_v2.py
          git diff --cached --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige desacoplamento do target absoluto Qlib V2"
          git push origin HEAD:codex/qlib-v2-absolute-target-decoupling-fix-v1
