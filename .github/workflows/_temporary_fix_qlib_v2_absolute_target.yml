name: Temporary fix Qlib V2 absolute target

on:
  push:
    branches:
      - codex/qlib-v2-absolute-target-decoupling-fix-v1
    paths:
      - .github/workflows/_temporary_fix_qlib_v2_absolute_target.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Apply refactor, validate and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_temporary_fix_qlib_v2_absolute_target.py
          git rm .github/workflows/_temporary_fix_qlib_v2_absolute_target.yml
          git rm scripts/_temporary_fix_qlib_v2_absolute_target.py
          python scripts/generate_project_manifest.py
          git add PROJECT_MANIFEST_CLEAN.json \
            smartcrypto/learning/paper_autolearning/qlib_market_context_economic_challenger.py \
            smartcrypto/learning/paper_autolearning/qlib_long_economic_policy_challenger_v2.py \
            tests/test_qlib_long_economic_policy_challenger_v2.py
          python scripts/generate_project_manifest.py --check
          python -m compileall -q smartcrypto tests
          pytest -q tests/test_qlib_long_economic_policy_challenger_v2.py
          git diff --cached --check

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige desacoplamento do target absoluto Qlib V2"
          git push origin HEAD:codex/qlib-v2-absolute-target-decoupling-fix-v1
