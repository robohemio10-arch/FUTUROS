name: PIT research validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pit-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SMARTCRYPTO_RUNTIME_MODE: paper
  LIVE_ENABLED: "false"
  ORDER_SUBMISSION_ENABLED: "false"
  REAL_ORDER_SUBMISSION_ENABLED: "false"
  EXCHANGE_PRIVATE_ACCESS: "false"
  SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
  RUNTIME_INTEGRATION_ALLOWED: "false"
  OPERATIONAL_AUTHORITY: "false"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_INDEX_URL: https://pypi.org/simple
  PIP_CONFIG_FILE: /dev/null
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pit-research:
    name: Hashed PIT graph, complete audit and synthetic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Create independent PIT environment
        run: |
          python -m venv "$RUNNER_TEMP/pit-research-venv"
          mkdir -p "$RUNNER_TEMP/pit-research-evidence"
          echo "PIT_PYTHON=$RUNNER_TEMP/pit-research-venv/bin/python" >> "$GITHUB_ENV"
          echo "PIT_EVIDENCE=$RUNNER_TEMP/pit-research-evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/pit-research-evidence/source-commit.txt"
          sha256sum requirements-pit-research.in requirements-pit-research.lock \
            .github/workflows/pit-research-validation.yml \
            scripts/audit_pit_research_dependencies_v1.py \
            > "$RUNNER_TEMP/pit-research-evidence/input-sha256.txt"

      - name: Resolve every locked dependency with verified wheel hashes
        run: |
          "$PIT_PYTHON" -m pip install --dry-run --ignore-installed \
            --require-hashes --only-binary=:all: \
            --report "$PIT_EVIDENCE/resolver-report.json" \
            -r requirements-pit-research.lock

      - name: Install only the independent hashed graph
        run: |
          "$PIT_PYTHON" -m pip install --force-reinstall --require-hashes --only-binary=:all: \
            --report "$PIT_EVIDENCE/install-report.json" \
            -r requirements-pit-research.lock
          "$PIT_PYTHON" -m pip check | tee "$PIT_EVIDENCE/pip-check.txt"
          "$PIT_PYTHON" -m pip inspect --local > "$PIT_EVIDENCE/installed-report.json"

      - name: Audit the entire installed environment without exceptions
        run: |
          "$PIT_PYTHON" -m pip_audit --strict --format json \
            --progress-spinner off --cache-dir "$RUNNER_TEMP/pit-research-audit-cache" \
            --output "$PIT_EVIDENCE/pip-audit.json"

      - name: Require full lock, resolver, inventory and audit agreement
        run: |
          "$PIT_PYTHON" scripts/audit_pit_research_dependencies_v1.py \
            --lock requirements-pit-research.lock \
            --resolver-report "$PIT_EVIDENCE/resolver-report.json" \
            --installed-report "$PIT_EVIDENCE/installed-report.json" \
            --audit-report "$PIT_EVIDENCE/pip-audit.json" \
            --json | tee "$PIT_EVIDENCE/dependency-coverage.json"

      - name: Compile PIT validation scope
        run: |
          "$PIT_PYTHON" -m compileall -q \
            scripts/audit_pit_research_dependencies_v1.py \
            smartcrypto/research/pretrade_causal_capture \
            tests/test_paper_pretrade_causal_capture_v1.py \
            tests/test_paper_pit_source_model_input_proof_v1.py \
            tests/test_pit_research_dependency_audit_v1.py

      - name: Test synthetic PIT proof and directly affected contracts
        run: |
          "$PIT_PYTHON" -m pytest -q -p no:cacheprovider \
            --basetemp "$RUNNER_TEMP/pit-research-tests" \
            --junitxml="$PIT_EVIDENCE/pit-tests.xml" \
            tests/test_paper_pretrade_causal_capture_v1.py \
            tests/test_paper_pit_source_model_input_proof_v1.py \
            tests/test_decision_ledger_payload_v4_2.py \
            tests/test_market_features_refresh_continuity_v1.py \
            tests/test_pit_research_dependency_audit_v1.py \
            | tee "$PIT_EVIDENCE/pytest.txt"

      - name: Check repository hygiene
        run: |
          "$PIT_PYTHON" scripts/generate_project_manifest.py --check
          "$PIT_PYTHON" scripts/scan_versioned_secrets.py --json
          git diff --exit-code
          git diff --check

      - name: Upload research validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pit-research-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pit-research-evidence
          if-no-files-found: error
