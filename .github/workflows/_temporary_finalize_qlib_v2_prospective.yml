name: Temporary finalize Qlib V2 prospective confirmation

on:
  push:
    branches:
      - codex/qlib-v2-prospective-paper-confirmation-v1
    paths:
      - .github/workflows/_temporary_finalize_qlib_v2_prospective.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r requirements-build.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Validate prospective package and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temporary_finalize_qlib_v2_prospective.yml
          python scripts/generate_project_manifest.py
          git add PROJECT_MANIFEST_CLEAN.json
          python scripts/generate_project_manifest.py --check
          python -m compileall -q scripts smartcrypto tests
          pytest -q tests/test_qlib_v2_prospective_paper_confirmation_v1.py
          git diff --cached --check

      - name: Commit canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincroniza manifesto da confirmação prospectiva Qlib V2"
          git push origin HEAD:codex/qlib-v2-prospective-paper-confirmation-v1
