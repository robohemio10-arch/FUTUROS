name: Temporary materialize profit branch

on:
  push:
    branches:
      - codex/market-features-continuity-economic-challenger-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/market-features-continuity-economic-challenger-v1
          fetch-depth: 0

      - name: Materialize frozen source payload and manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .github/_profit_payload.part.00 .github/_profit_payload.part.01 .github/_profit_payload.part.02 > /tmp/futuros_profit_payload.tar.gz.b64
          base64 -d /tmp/futuros_profit_payload.tar.gz.b64 > /tmp/futuros_profit_payload.tar.gz
          echo "654df22ce610b5ec4d252634bfd3925f79c58a2b69b061c9c6f153bcbda79f5f  /tmp/futuros_profit_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/futuros_profit_payload.tar.gz -C .
          rm -f .github/_profit_payload.part.00 .github/_profit_payload.part.01 .github/_profit_payload.part.02
          rm -f .github/workflows/_temporary_materialize_profit_branch.yml
          git add -A
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json
          git add PROJECT_MANIFEST_CLEAN.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Corrige continuidade de features e adiciona challenger econômico Qlib"
          git push origin HEAD:codex/market-features-continuity-economic-challenger-v1
