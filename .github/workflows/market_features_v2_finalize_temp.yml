name: Market features V2 finalize temp

on:
  push:
    branches:
      - codex/market-features-rematerialization-research-v2
    paths:
      - .github/workflows/market_features_v2_finalize_temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/market-features-rematerialization-research-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch stable merge index and regenerate manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("smartcrypto/research/market_features_rematerialization_research_v2/engine.py")
          text = path.read_text(encoding="utf-8")
          old_left = 'left["_source_index"] = left.index'
          old_row = 'index = int(row._source_index)'
          if text.count(old_left) != 1 or text.count(old_row) != 1:
              raise SystemExit("unexpected_alignment_patch_cardinality")
          text = text.replace(old_left, 'left["source_index"] = left.index')
          text = text.replace(old_row, 'index = int(row.source_index)')
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/market_features_v2_finalize_temp.yml
          python scripts/generate_project_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smartcrypto/research/market_features_rematerialization_research_v2/engine.py PROJECT_MANIFEST_CLEAN.json
          git commit -m "Finaliza market features research V2"
          git push origin HEAD:codex/market-features-rematerialization-research-v2
