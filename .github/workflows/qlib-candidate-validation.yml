name: Qlib candidate validation

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/qlib-candidate-validation.yml"
      - "requirements-qlib*.lock"
      - "requirements-qlib-security-candidate.in"
      - "config/qlib_dependency_security_policy_v1.json"
      - "config/security_resolution_evidence_v1.json"
      - "smartcrypto/learning/qlib_dependency_security_hardening/**"
      - "scripts/audit_qlib*security*.py"
      - "tests/test_qlib*security*.py"
      - "tests/test_qlib_candidate_validation_ci_v1.py"
      - "docker/qlib/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qlib-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SMARTCRYPTO_RUNTIME_MODE: paper
  LIVE_ENABLED: "false"
  ORDER_SUBMISSION_ENABLED: "false"
  REAL_ORDER_SUBMISSION_ENABLED: "false"
  EXCHANGE_PRIVATE_ACCESS: "false"
  SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"

jobs:
  validate-candidate:
    name: Qlib candidate evidence (not P08 authorization)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare independent audit tools and provenance
        run: |
          python -m venv "$RUNNER_TEMP/qlib-auditor"
          "$RUNNER_TEMP/qlib-auditor/bin/python" -m pip install --disable-pip-version-check pip-audit==2.9.0 pytest==9.0.3 PyYAML==6.0.3
          mkdir -p "$RUNNER_TEMP/qlib-candidate-evidence"
          "$RUNNER_TEMP/qlib-auditor/bin/python" -m pip list --format json > "$RUNNER_TEMP/qlib-candidate-evidence/audit-tool-versions.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record = {"candidate_head_sha": head, "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                    "policy_state": "PENDING_CERTIFICATION", "p08_allowed": False,
                    "operational_authority": False, "validation_only": True}
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qlib-candidate-evidence/provenance.json"
          target.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          PY

      - name: Build existing Qlib image with observable hashed installation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path("docker/qlib/Dockerfile").read_text()
          command = "python -m pip install --require-hashes -r requirements-qlib-security.lock"
          if source.count(command) != 1:
              raise SystemExit("canonical_qlib_install_command_changed")
          # Force the install report to include bootstrap packages already present in the base.
          replacement = command + " --ignore-installed --report /tmp/qlib-install-report.json"
          target = Path(os.environ["RUNNER_TEMP"]) / "qlib-candidate.Dockerfile"
          target.write_text(source.replace(command, replacement))
          PY
          docker build --file "$RUNNER_TEMP/qlib-candidate.Dockerfile" --tag qlib-candidate-ci .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true --user 10001:10001 \
            qlib-candidate-ci python -c 'from pathlib import Path; print(Path("/tmp/qlib-install-report.json").read_text())' \
            > "$RUNNER_TEMP/qlib-candidate-evidence/qlib-install-report.json"

      - name: Audit every exact hashed Qlib pin without a second resolution
        run: |
          "$RUNNER_TEMP/qlib-auditor/bin/python" -m pip_audit \
            -r requirements-qlib-security.lock --require-hashes --no-deps --disable-pip \
            --strict --format json --progress-spinner off \
            --output "$RUNNER_TEMP/qlib-candidate-evidence/qlib-pip-audit.json"

      - name: Require exact coverage and installation identity without authorizing P08
        run: |
          "$RUNNER_TEMP/qlib-auditor/bin/python" scripts/audit_qlib_dependency_security_hardening_v1.py \
            --project-root . --candidate-validation \
            --resolver-report "$RUNNER_TEMP/qlib-candidate-evidence/qlib-install-report.json" \
            --hashed-install-report "$RUNNER_TEMP/qlib-candidate-evidence/qlib-install-report.json" \
            --pip-audit-report "$RUNNER_TEMP/qlib-candidate-evidence/qlib-pip-audit.json" --json \
            > "$RUNNER_TEMP/qlib-candidate-evidence/qlib-candidate-validation.json"

      - name: Run focused coverage and governance regressions
        run: |
          "$RUNNER_TEMP/qlib-auditor/bin/python" -m pytest -q \
            tests/test_qlib_dependency_security_hardening_v1.py \
            tests/test_qlib_security_functional_regression_v1.py \
            tests/test_qlib_candidate_validation_ci_v1.py

      - name: Validate real Qlib training and inference offline
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges=true \
            --user 10001:10001 --memory 4g --cpus 2 --pids-limit 128 --tmpfs /tmp:rw,nosuid,size=1g \
            -e HOME=/tmp -e MLFLOW_ALLOW_PICKLE_DESERIALIZATION=false -e MLFLOW_DISABLE_TELEMETRY=true \
            -e SMARTCRYPTO_QLIB_NETWORK_MODE=none -e SMARTCRYPTO_QLIB_REPOSITORY_MOUNT=readonly \
            -e LIVE_ENABLED=false -e ORDER_SUBMISSION_ENABLED=false -e REAL_ORDER_SUBMISSION_ENABLED=false \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            qlib-candidate-ci python /workspace/scripts/audit_qlib_security_functional_regression_v1.py \
              --project-root /workspace --json > "$RUNNER_TEMP/qlib-candidate-evidence/qlib-functional.stdout"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "qlib-candidate-evidence"
          report = json.loads((root / "qlib-functional.stdout").read_text().splitlines()[-1])
          if (report.get("status") != "ok" or report.get("p08_allowed") is not False
                  or report["security"]["exact_certified_graph"] is not False):
              raise SystemExit("candidate_functional_regression_or_authorization_contract_failed")
          (root / "qlib-functional.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY

      - name: Check manifest, secrets and unchanged worktree
        run: |
          python scripts/generate_project_manifest.py --check
          python scripts/scan_versioned_secrets.py --json
          git diff --exit-code
          git diff --check
          sha256sum requirements-qlib-security.lock "$RUNNER_TEMP/qlib-candidate-evidence/"*.json > "$RUNNER_TEMP/qlib-candidate-evidence/SHA256SUMS"

      - name: Upload candidate validation evidence (not certification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qlib-candidate-validation-evidence
          path: ${{ runner.temp }}/qlib-candidate-evidence
          if-no-files-found: error
