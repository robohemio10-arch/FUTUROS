name: AIBOT P10 Canonical Manifest Finalize

on:
  push:
    branches:
      - codex/aibot-parity-dashboard-and-orchestrator-v1

permissions:
  contents: write

jobs:
  finalize_manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P10 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/aibot-parity-dashboard-and-orchestrator-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove one-shot workflow before manifest generation
        run: git rm .github/workflows/aibot_p10_manifest_finalize.yml

      - name: Generate and verify canonical manifest
        run: |
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json --check

      - name: Verify staged scope
        run: |
          git add PROJECT_MANIFEST_CLEAN.json
          git diff --cached --check
          git status --short
          git diff --cached --name-only

      - name: Commit canonical manifest and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenera manifesto canonico do P10"
          git push origin HEAD:codex/aibot-parity-dashboard-and-orchestrator-v1
