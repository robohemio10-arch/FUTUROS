name: AIBOT prospective collector manifest sync temp

on:
  push:
    branches:
      - codex/aibot-parity-paper-ab-prospective-collector-v1

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove temporary helper and regenerate deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aibot_prospective_collector_manifest_sync_temp.yml
          python scripts/generate_project_manifest.py --project-root . --output PROJECT_MANIFEST_CLEAN.json
          python scripts/generate_project_manifest.py --project-root . --check
          git add PROJECT_MANIFEST_CLEAN.json
          git diff --cached --check
          git commit -m "Sincroniza manifesto do collector prospectivo AIBOT"
          git push origin "HEAD:${GITHUB_REF_NAME}"
