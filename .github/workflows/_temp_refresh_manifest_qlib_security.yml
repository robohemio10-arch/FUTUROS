name: TEMP Refresh Qlib Security Manifest

on:
  push:
    branches:
      - automation/refresh-manifest-qlib-security-v1

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qlib-security-functional-regression-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify expected target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0598dba4926a80f774c214753fbfdfb0442936e8"

      - name: Regenerate deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_project_manifest.py --project-root .
          python scripts/generate_project_manifest.py --project-root . --check
          git diff --check -- PROJECT_MANIFEST_CLEAN.json

      - name: Commit manifest to target branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PROJECT_MANIFEST_CLEAN.json; then
            echo "manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MANIFEST_CLEAN.json
          git commit -m "Atualiza manifesto final da certificação Qlib"
          git push origin HEAD:refs/heads/codex/qlib-security-functional-regression-v1
