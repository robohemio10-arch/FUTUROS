name: Market features V2 manifest sync temp

on:
  push:
    branches:
      - codex/market-features-rematerialization-research-v2
    paths:
      - .github/workflows/market_features_v2_manifest_sync_temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/market-features-rematerialization-research-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove helper and regenerate manifest
        shell: bash
        run: |
          git rm .github/workflows/market_features_v2_manifest_sync_temp.yml
          python scripts/generate_project_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MANIFEST_CLEAN.json
          git commit -m "Sincroniza manifesto do market features V2"
          git push origin HEAD:codex/market-features-rematerialization-research-v2
