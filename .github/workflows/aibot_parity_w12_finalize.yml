name: AIBOT Parity W12 Finalize

on:
  push:
    branches:
      - codex/aibot-parity-dashboard-and-orchestrator-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/aibot-parity-dashboard-and-orchestrator-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Apply W12 dashboard integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          REPORT = 'data/reports/aibot_parity/aibot_parity_e2e_snapshot_v1.json'

          def patch(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
              target.write_text(text.replace(old, new, count), encoding='utf-8')

          # Source catalog: W13 report is planned/non-blocking when not materialized.
          path = 'smartcrypto/ops/dashboard_snapshots/source_catalog.py'
          for page in ('opportunity_scanner', 'ai_governance', 'quantitative_reports'):
              old = f'        _generated(DashboardPageId.{page}),'
              new = (
                  f'        _source(DashboardPageId.{page}, "{REPORT}", SourceKind.FUTURE_SOURCE, '
                  '"AIBOT-Parity W13 read-only E2E projection; materialized only by explicit research/shadow pipeline run."),\n'
                  + old
              )
              patch(path, old, new)

          # Opportunity snapshot builder.
          path = 'smartcrypto/ops/dashboard_snapshots/opportunity_scanner_snapshot_builder.py'
          patch(
              path,
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
              'from smartcrypto.ops.dashboard_snapshots.aibot_parity_integration import (\n'
              '    build_aibot_parity_dashboard_section,\n'
              ')\n'
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
          )
          patch(path, '    "governance",\n    "audit",', '    "governance",\n    "aibot_parity",\n    "audit",')
          patch(
              path,
              '        "governance": section(DashboardSectionStatus.OK, **governance),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True),',
              '        "governance": section(DashboardSectionStatus.OK, **governance),\n'
              '        "aibot_parity": build_aibot_parity_dashboard_section(\n'
              '            sources, "opportunity_scanner"\n'
              '        ),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True),',
          )

          # AI governance builder.
          path = 'smartcrypto/ops/dashboard_snapshots/ai_governance_snapshot_builder.py'
          patch(
              path,
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
              'from smartcrypto.ops.dashboard_snapshots.aibot_parity_integration import (\n'
              '    build_aibot_parity_dashboard_section,\n'
              ')\n'
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
          )
          patch(
              path,
              '    "ai_training_research_command_center",\n    "audit",',
              '    "ai_training_research_command_center",\n    "aibot_parity",\n    "audit",',
          )
          patch(
              path,
              '        "model_governance": section(DashboardSectionStatus.OK, auto_promotion_allowed=False, live_model_promotion_allowed=False, model_promotion_allowed_from_dashboard=False, accuracy_is_primary_metric=False, promotion_status=HardBlockStatus.HARD_BLOCKED.value),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True, trains_model=False, promotes_model=False),',
              '        "model_governance": section(DashboardSectionStatus.OK, auto_promotion_allowed=False, live_model_promotion_allowed=False, model_promotion_allowed_from_dashboard=False, accuracy_is_primary_metric=False, promotion_status=HardBlockStatus.HARD_BLOCKED.value),\n'
              '        "aibot_parity": build_aibot_parity_dashboard_section(\n'
              '            sources, "ai_governance"\n'
              '        ),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True, trains_model=False, promotes_model=False),',
          )

          # Quantitative reports builder.
          path = 'smartcrypto/ops/dashboard_snapshots/quantitative_reports_snapshot_builder.py'
          patch(
              path,
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
              'from smartcrypto.ops.dashboard_snapshots.aibot_parity_integration import (\n'
              '    build_aibot_parity_dashboard_section,\n'
              ')\n'
              'from smartcrypto.ops.dashboard_snapshots.build_context import DashboardBuildContext\n',
          )
          patch(path, '    "institutional_score",\n    "audit",', '    "institutional_score",\n    "aibot_parity",\n    "audit",')
          patch(
              path,
              '        "institutional_score": section(DashboardSectionStatus.OK, score=institutional, weights={"robustness": 0.25, "risk": 0.25, "tca": 0.20, "recovery": 0.15, "consistency": 0.10, "winrate": 0.05}),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True),',
              '        "institutional_score": section(DashboardSectionStatus.OK, score=institutional, weights={"robustness": 0.25, "risk": 0.25, "tca": 0.20, "recovery": 0.15, "consistency": 0.10, "winrate": 0.05}),\n'
              '        "aibot_parity": build_aibot_parity_dashboard_section(\n'
              '            sources, "quantitative_reports"\n'
              '        ),\n'
              '        "audit": section(DashboardSectionStatus.OK, dashboard_reads_only=True),',
          )

          # Page 04: dedicated read-only E2E panel.
          path = 'smartcrypto/dashboard/pages/04_opportunity_scanner.py'
          patch(path, '    "governance",\n    "audit",', '    "governance",\n    "aibot_parity",\n    "audit",')
          patch(
              path,
              '    governance = _mapping(sections.get("governance"))\n    audit = _mapping(sections.get("audit"))',
              '    governance = _mapping(sections.get("governance"))\n'
              '    aibot_parity = _mapping(sections.get("aibot_parity"))\n'
              '    audit = _mapping(sections.get("audit"))',
          )
          marker = '    target_ui.markdown(\n        render_section_panel(\n            "Diagnóstico do Snapshot",'
          panel = '''    target_ui.markdown(
        render_section_panel(
            "AIBOT-Parity E2E · Shadow",
            render_html_table(
                _aibot_parity_rows(aibot_parity),
                columns=["Campo", "Valor"],
                empty_message="Pipeline E2E ainda não materializado · UNKNOWN",
            ),
            subtitle=(
                "Projeção somente leitura do W13. WOULD_SIGNAL é contrafactual; "
                "writes_active_signals permanece false."
            ),
            status=_section_status(aibot_parity),
        ),
        unsafe_allow_html=True,
    )

'''
          patch(path, marker, panel + marker)
          helper_marker = 'def _diagnostic_rows(snapshot: Mapping[str, Any], audit: Mapping[str, Any]) -> list[dict[str, Any]]:'
          helper = '''def _aibot_parity_rows(section: Mapping[str, Any]) -> list[dict[str, Any]]:
    if not section:
        return []
    return [
        {"Campo": "cycle_id", "Valor": _display_text(section.get("cycle_id"))},
        {"Campo": "pipeline_status", "Valor": _display_text(section.get("pipeline_status"))},
        {"Campo": "final_action", "Valor": _display_text(section.get("final_action"))},
        {"Campo": "selected_candidate_count", "Valor": _display_text(section.get("selected_candidate_count"))},
        {"Campo": "would_signal", "Valor": _format_bool(section.get("would_signal"))},
        {"Campo": "writes_active_signals", "Valor": _format_bool(section.get("writes_active_signals"))},
        {"Campo": "signal_published", "Valor": _format_bool(section.get("signal_published"))},
        {"Campo": "RiskManager final", "Valor": _format_bool(section.get("riskmanager_final_authority"))},
    ]


'''
          patch(path, helper_marker, helper + helper_marker)

          # Page 05: dedicated governance projection.
          path = 'smartcrypto/dashboard/pages/05_ai_governance.py'
          patch(
              path,
              '    "ai_training_research_command_center",\n    "audit",',
              '    "ai_training_research_command_center",\n    "aibot_parity",\n    "audit",',
          )
          patch(
              path,
              '    research = _mapping(sections.get("ai_training_research_command_center"))\n    audit = _mapping(sections.get("audit"))',
              '    research = _mapping(sections.get("ai_training_research_command_center"))\n'
              '    aibot_parity = _mapping(sections.get("aibot_parity"))\n'
              '    audit = _mapping(sections.get("audit"))',
          )
          marker = '    target_ui.markdown(\n        render_section_panel(\n            "AI Training Research Command Center",'
          panel = '''    target_ui.markdown(
        render_section_panel(
            "AIBOT-Parity E2E · Governance",
            render_html_table(
                _aibot_parity_rows(aibot_parity),
                columns=["Controle", "Valor"],
                empty_message="Pipeline E2E ainda não materializado · UNKNOWN",
            ),
            subtitle=(
                "Qlib pode permanecer BLOCKED_EXTERNAL; RiskManager continua final e "
                "nenhuma projeção concede promoção ou autoridade operacional."
            ),
            status=_section_status(aibot_parity),
        ),
        unsafe_allow_html=True,
    )

'''
          patch(path, marker, panel + marker)
          helper_marker = 'def _model_state_value(section: Mapping[str, Any]) -> str:'
          helper = '''def _aibot_parity_rows(section: Mapping[str, Any]) -> list[dict[str, Any]]:
    if not section:
        return []
    return [
        {"Controle": "cycle_id", "Valor": _display(section.get("cycle_id"))},
        {"Controle": "pipeline_status", "Valor": _display(section.get("pipeline_status"))},
        {"Controle": "ensemble_action", "Valor": _display(section.get("ensemble_action"))},
        {"Controle": "qlib_status", "Valor": _display(section.get("qlib_status"))},
        {"Controle": "riskmanager_shadow_decision", "Valor": _display(section.get("riskmanager_shadow_decision"))},
        {"Controle": "would_signal", "Valor": _display(section.get("would_signal"))},
        {"Controle": "writes_active_signals", "Valor": _display(section.get("writes_active_signals"))},
        {"Controle": "operational_authority", "Valor": _display(section.get("operational_authority"))},
        {"Controle": "model_promotion_allowed", "Valor": _display(section.get("model_promotion_allowed"))},
    ]


'''
          patch(path, helper_marker, helper + helper_marker)

          # Page 07 is compact: expose W13 coverage in a dedicated read-only table.
          path = 'smartcrypto/dashboard/pages/07_quantitative_reports.py'
          patch(
              path,
              'from __future__ import annotations\n\nfrom pathlib import Path\nfrom typing import Any\n',
              'from __future__ import annotations\n\nfrom collections.abc import Mapping\nfrom pathlib import Path\nfrom typing import Any\n',
          )
          patch(
              path,
              '    render_global_topbar,\n    render_page_title,\n    render_sidebar,',
              '    render_global_topbar,\n    render_html_table,\n    render_page_title,\n    render_section_panel,\n    render_sidebar,',
          )
          patch(
              path,
              '    "regime_comparison", "asset_comparison", "soak_gap_accounting", "exports", "institutional_score", "audit",',
              '    "regime_comparison", "asset_comparison", "soak_gap_accounting", "exports", "institutional_score", "aibot_parity", "audit",',
          )
          marker = '    target_ui.markdown(\n        render_chart_placeholder("Equity Curve / Drawdown", "Série temporal indisponível no snapshot"),'
          panel = '''    sections = snapshot.get("sections", {})
    aibot_parity = sections.get("aibot_parity", {}) if isinstance(sections, Mapping) else {}
    aibot_parity = aibot_parity if isinstance(aibot_parity, Mapping) else {}
    target_ui.markdown(
        render_section_panel(
            "AIBOT-Parity E2E · Coverage",
            render_html_table(
                _aibot_parity_rows(aibot_parity),
                columns=["Campo", "Valor"],
                empty_message="Pipeline E2E ainda não materializado · UNKNOWN",
            ),
            subtitle=(
                "Cobertura PIT e subsistemas W1-W9; apresentação somente leitura, "
                "writes_active_signals=false."
            ),
            status=str(aibot_parity.get("status") or "UNKNOWN"),
        ),
        unsafe_allow_html=True,
    )
'''
          patch(path, marker, panel + marker)
          helper_marker = 'def render_missing_snapshot(reason: str, *, ui: Any | None = None) -> None:'
          helper = '''def _aibot_parity_rows(section: Mapping[str, Any]) -> list[dict[str, Any]]:
    if not section:
        return []
    keys = (
        "cycle_id",
        "pipeline_status",
        "required_source_count",
        "required_sources_present_count",
        "point_in_time_valid_required_count",
        "execution_intelligence_status",
        "risk_budget_status",
        "treasury_status",
        "qlib_status",
        "final_action",
        "writes_active_signals",
        "operational_authority",
    )
    return [{"Campo": key, "Valor": str(section.get(key, "UNKNOWN"))} for key in keys]


'''
          patch(path, helper_marker, helper + helper_marker)
          PY
      - name: Remove one-shot workflow from final tree
        run: git rm .github/workflows/aibot_parity_w12_finalize.yml
      - name: Focused validation
        run: |
          python -m compileall -q scripts/run_aibot_parity_local_pipeline_v1.py smartcrypto/research/aibot_parity_orchestrator smartcrypto/ops/dashboard_snapshots smartcrypto/dashboard/pages tests/test_aibot_parity_local_pipeline_v1.py tests/test_aibot_parity_dashboard_and_orchestrator_v1.py
          python -m pytest -q tests/test_aibot_parity_local_pipeline_v1.py tests/test_aibot_parity_dashboard_and_orchestrator_v1.py
      - name: Regenerate deterministic manifest
        run: |
          python scripts/generate_project_manifest.py
          python scripts/generate_project_manifest.py --check
      - name: Commit finalized W12 W13 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_MANIFEST_CLEAN.json smartcrypto scripts tests
          git diff --cached --check
          git status --short
          git commit -m 'Integra dashboard e orquestrador AIBOT parity W12 W13'
          git push origin HEAD:codex/aibot-parity-dashboard-and-orchestrator-v1
