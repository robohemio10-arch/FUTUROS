name: TEMP Refresh Qlib Native Economic Manifest

on:
  push:
    branches:
      - automation/refresh-manifest-qlib-native-economic-v1

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/qlib-native-economic-challenger-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Regenerate deterministic manifest
        run: python scripts/generate_project_manifest.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MANIFEST_CLEAN.json
          if git diff --cached --quiet; then
            echo "manifest already current"
            exit 0
          fi
          git commit -m "Atualiza manifesto do challenger econômico Qlib nativo"
          git push origin HEAD:codex/qlib-native-economic-challenger-v1
