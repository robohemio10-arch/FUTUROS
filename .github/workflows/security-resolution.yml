name: Security resolution evidence

on:
  push:
    branches:
      - "codex/dev-security-governance-hardening-closeout-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Pin resolver toolchain
        run: python -m pip install pip==26.2.1 setuptools==82.0.1 wheel==0.48.0 pip-audit==2.9.0

      - name: Generate hashed locks for existing exact graphs
        run: |
          mkdir -p security-resolution
          python scripts/generate_hashed_lock_v1.py requirements-dev.lock security-resolution/requirements-dev.hashed.lock
          python scripts/generate_hashed_lock_v1.py requirements-runtime.lock security-resolution/requirements-runtime.hashed.lock

      - name: Resolve Bitradex graph and hashes
        run: |
          python -m pip install --dry-run --ignore-installed --report security-resolution/bitradex-resolver-report.json -r bitradex_realtime_candle_collector_v1/requirements.txt
          python scripts/pip_report_to_lock_v1.py security-resolution/bitradex-resolver-report.json security-resolution/bitradex.lock
          python scripts/generate_hashed_lock_v1.py security-resolution/bitradex.lock security-resolution/bitradex.hashed.lock

      - name: Resolve and audit Qlib security candidate
        run: |
          python -m pip install --dry-run --ignore-installed --report security-resolution/qlib-resolver-report.json -r requirements-qlib-security-candidate.in
          python scripts/pip_report_to_lock_v1.py security-resolution/qlib-resolver-report.json security-resolution/requirements-qlib-security.lock
          python scripts/generate_hashed_lock_v1.py security-resolution/requirements-qlib-security.lock security-resolution/requirements-qlib-security.hashed.lock
          set +e
          python -m pip_audit -r security-resolution/requirements-qlib-security.lock --format json --output security-resolution/qlib-pip-audit.json --progress-spinner off
          code=$?
          set -e
          echo "$code" > security-resolution/qlib-pip-audit.exitcode
          test "$code" -eq 0

      - name: Resolve immutable container digests
        run: |
          docker buildx imagetools inspect python:3.11-slim | tee security-resolution/python-3.11-slim.inspect.txt
          docker buildx imagetools inspect python:3.12-slim | tee security-resolution/python-3.12-slim.inspect.txt
          docker buildx imagetools inspect freqtradeorg/freqtrade:stable | tee security-resolution/freqtrade-stable.inspect.txt
          grep -m1 '^Digest:' security-resolution/python-3.11-slim.inspect.txt | awk '{print $2}' > security-resolution/python-3.11-slim.digest
          grep -m1 '^Digest:' security-resolution/python-3.12-slim.inspect.txt | awk '{print $2}' > security-resolution/python-3.12-slim.digest
          grep -m1 '^Digest:' security-resolution/freqtrade-stable.inspect.txt | awk '{print $2}' > security-resolution/freqtrade-stable.digest
          grep -Eq '^sha256:[0-9a-f]{64}$' security-resolution/python-3.11-slim.digest
          grep -Eq '^sha256:[0-9a-f]{64}$' security-resolution/python-3.12-slim.digest
          grep -Eq '^sha256:[0-9a-f]{64}$' security-resolution/freqtrade-stable.digest

      - name: Upload resolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-resolution-evidence
          path: security-resolution
          if-no-files-found: error
