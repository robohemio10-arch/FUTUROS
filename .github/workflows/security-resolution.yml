name: Security resolution evidence

on:
  push:
    branches:
      - "codex/dev-security-governance-hardening-closeout-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install hermetic audit environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify checked-in hashed locks
        run: |
          mkdir -p security-resolution
          python -m pip install --dry-run --ignore-installed --require-hashes --report security-resolution/dev-resolver-report.json -r requirements-dev.lock
          python -m pip install --dry-run --ignore-installed --require-hashes --report security-resolution/runtime-resolver-report.json -r requirements-runtime.lock
          cp requirements-dev.lock security-resolution/requirements-dev.hashed.lock
          cp requirements-runtime.lock security-resolution/requirements-runtime.hashed.lock

      - name: Verify Bitradex graph and hashes
        run: |
          python -m pip install --dry-run --ignore-installed --require-hashes --report security-resolution/bitradex-resolver-report.json -r bitradex_realtime_candle_collector_v1/requirements.txt
          cp bitradex_realtime_candle_collector_v1/requirements.txt security-resolution/bitradex.hashed.lock

      - name: Verify and audit Qlib security lock
        run: |
          python -m pip install --dry-run --ignore-installed --require-hashes --report security-resolution/qlib-resolver-report.json -r requirements-qlib-security.lock
          cp requirements-qlib-security.lock security-resolution/requirements-qlib-security.hashed.lock
          set +e
          python -m pip_audit -r requirements-qlib-security.lock --format json --output security-resolution/qlib-pip-audit.json --progress-spinner off
          code=$?
          set -e
          echo "$code" > security-resolution/qlib-pip-audit.exitcode
          test "$code" -eq 0
          python scripts/audit_qlib_dependency_security_hardening_v1.py             --project-root .             --resolver-report security-resolution/qlib-resolver-report.json             --pip-audit-report security-resolution/qlib-pip-audit.json             --json

      - name: Verify immutable container digests
        run: |
          docker buildx imagetools inspect python:3.11-slim@sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534 | tee security-resolution/python-3.11-slim.inspect.txt
          docker buildx imagetools inspect python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea | tee security-resolution/python-3.12-slim.inspect.txt
          docker buildx imagetools inspect freqtradeorg/freqtrade:stable@sha256:7031bca43ed7668ebf421725dd5016acade6ef88b0771db3e08c96e6d19a42db | tee security-resolution/freqtrade-stable.inspect.txt
          printf '%s\n' 'sha256:9534e5a8e315485d4061ed659af0fd78a284c015f9b73661b41d6bab25604534' > security-resolution/python-3.11-slim.digest
          printf '%s\n' 'sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea' > security-resolution/python-3.12-slim.digest
          printf '%s\n' 'sha256:7031bca43ed7668ebf421725dd5016acade6ef88b0771db3e08c96e6d19a42db' > security-resolution/freqtrade-stable.digest

      - name: Upload resolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-resolution-evidence
          path: security-resolution
          if-no-files-found: error
