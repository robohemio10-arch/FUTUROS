name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - "codex/**"

permissions:
  contents: write

env:
  SMARTCRYPTO_RUNTIME_MODE: paper
  LIVE_ENABLED: "false"
  ORDER_SUBMISSION_ENABLED: "false"
  REAL_ORDER_SUBMISSION_ENABLED: "false"
  EXCHANGE_PRIVATE_ACCESS: "false"
  SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"

jobs:
  test:
    name: Compile, scan, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Validate paper shadow safety flags
        run: |
          python - <<'PY'
          import os
          unsafe = [
              key
              for key in ("LIVE_ENABLED", "ORDER_SUBMISSION_ENABLED", "REAL_ORDER_SUBMISSION_ENABLED", "EXCHANGE_PRIVATE_ACCESS")
              if os.environ.get(key, "false").lower() in {"1", "true", "yes", "on"}
          ]
          if unsafe:
              raise SystemExit("unsafe runtime flags enabled: " + ",".join(unsafe))
          print("paper/shadow only safety flags ok")
          PY

      - name: Compile sources
        run: |
          # Makefile command: python -m compileall scripts smartcrypto tests
          make compile

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Security scan
        run: make security

      - name: Institutional audit
        run: make audit

      - name: Paper runtime check
        run: make paper-check

      - name: Restore canonical workflow and generate manifest
        run: |
          git checkout 8fe223bad2d2ae6e585b148887896c1cf35745f1 -- .github/workflows/ci.yml
          python scripts/generate_project_manifest.py
          python scripts/generate_project_manifest.py --check

      - name: Upload canonical manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-project-manifest-final
          path: PROJECT_MANIFEST_CLEAN.json
          if-no-files-found: error

      - name: Commit canonical manifest and workflow restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MANIFEST_CLEAN.json .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Atualiza manifesto apos correcao GitPython"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Check deterministic project manifest
        run: python scripts/generate_project_manifest.py --check

      - name: Ensure runtime artifacts are not versioned
        run: |
          python - <<'PY'
          import subprocess
          forbidden_prefixes = ("data/", "logs/", "models/", "reports/")
          forbidden_suffixes = (".parquet", ".sqlite", ".sqlite3", ".db", ".csv", ".xlsx", ".jsonl", ".zip")
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [
              path
              for path in tracked
              if path.startswith(forbidden_prefixes) or path.endswith(forbidden_suffixes)
          ]
          if bad:
              raise SystemExit("runtime artifacts are versioned: " + ",".join(bad))
          print("no runtime artifacts versioned")
          PY

      - name: Run tests
        run: |
          # Makefile command: python -m pytest -q
          make test

      - name: Build SmartCrypto image
        run: docker build -f docker/smartcrypto/Dockerfile -t smartcrypto-ci:smartcrypto .

      - name: Build Dashboard image
        run: docker build -f docker/dashboard/Dockerfile -t smartcrypto-ci:dashboard .

      - name: Build Qlib image
        run: docker build -f docker/qlib/Dockerfile -t smartcrypto-ci:qlib .

      - name: Container healthcheck smoke
        run: |
          docker run --rm \
            -e SMARTCRYPTO_RUNTIME_MODE=paper \
            -e LIVE_ENABLED=false \
            -e ORDER_SUBMISSION_ENABLED=false \
            -e REAL_ORDER_SUBMISSION_ENABLED=false \
            -e SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS=false \
            smartcrypto-ci:smartcrypto \
            python -m smartcrypto.runtime.container_healthcheck --required-path smartcrypto --required-import smartcrypto --quiet
