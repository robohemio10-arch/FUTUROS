mode: research
paper_only: true
shadow_only: true
research_only: true
operational_authority: false
sends_orders: false
exchange_private_access: false
changes_risk: false
changes_model: false
writes_active_signals: false
live_release_allowed: false
canary_release_allowed: false
network_required: false
risk_budget_operationally_applied: false
treasury_operationally_applied: false
riskmanager_final_authority: true

risk_budget:
  calibration_method: stress_mc_cvar_v1
  fixed_daily_drawdown_copy_allowed: false
  protection_states:
    - NORMAL
    - CONSERVATIVE
    - PROTECTION
    - REDUCE_ONLY
    - PAUSED
    - PANIC
  deescalation_limited_to_one_step: true

stress:
  monte_carlo_deterministic_seed_required: true
  cvar_required: true
  scenario_stress_required: true
  future_observations_allowed: false

treasury:
  separate_from_strategy_pnl: true
  reserve_can_mask_negative_expectancy: false
  alpha_pnl_includes_reserve_transfer: false

research:
  shadow_simulation_only: true
  riskmanager_final_authority: true
  operational_risk_mutation_allowed: false
  treasury_runtime_mutation_allowed: false
