mode: research
paper_only: true
shadow_only: true
research_only: true
operational_authority: false
sends_orders: false
exchange_private_access: false
changes_risk: false
changes_model: false
writes_active_signals: false
live_release_allowed: false
canary_release_allowed: false
network_required: false

execution:
  probability_model: deterministic_liquidity_proxy_v1
  allowed_policies:
    - single_limit
    - maker_reprice
    - twap
    - aggressive_limit
  max_timeout_seconds: 3600
  max_reprices: 100
  max_twap_slices: 100
  max_aggressive_limit_bps: 2000
  max_participation_cap: 1.0

intrabar:
  allowed_granularities:
    - 15s
    - 1m
  intrabar_ordering: conservative_adverse_first
  allowed_exit_policies:
    - breakeven
    - trailing
    - time_stop
  same_bar_activation_and_stop_allowed: false

research:
  execution_policy_paper_authorized: false
  edge_claim_allowed: false
  requires_pre_registered_paper_experiment_for_wiring: true
