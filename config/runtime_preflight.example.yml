runtime_mode: paper

safety:
  live_enabled: false
  order_submission_enabled: false
  real_order_submission_enabled: false
  allow_ai_to_increase_size: false
  allow_dashboard_direct_order: false
  use_real_exchange: false
  require_private_keys: false

risk_limits:
  max_drawdown_pct: 5.0
  max_data_age_seconds: 300
  max_spread_bps: 25.0
  max_order_notional: 50.0
  max_capital_global: 500.0

paths:
  state_repository: data/runtime/state_repository.json
  financial_event_log: data/runtime/runtime_preflight_events.jsonl

market_data:
  source: local_snapshot_only
  external_api_enabled: false

reconciliation:
  block_on_divergence: true
  auto_repair_enabled: false
