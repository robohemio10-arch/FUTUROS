services:
  smartcrypto-bot-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      SMARTCRYPTO_DB_PATH: /app/data/sqlite/trading_dataset.sqlite
      SMARTCRYPTO_SIGNALS_PATH: /app/data/freqtrade_signals.json
      SMARTCRYPTO_PREDICTIONS_PATH: /app/data/predictions/latest_predictions.parquet
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command: python -m smartcrypto.bot

  smartcrypto-dashboard-paper:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      DASHBOARD_READONLY_DEFAULT: "true"
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      SMARTCRYPTO_DB_PATH: /app/data/sqlite/trading_dataset.sqlite
      SMARTCRYPTO_SIGNALS_PATH: /app/data/freqtrade_signals.json
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    ports:
      - "127.0.0.1:8502:8501"
    command: streamlit run smartcrypto/dashboard/app.py --server.address 0.0.0.0 --server.port 8501

  freqtrade-paper:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
    volumes:
      - ./freqtrade/user_data/config.paper.json:/freqtrade/user_data/config.paper.json:ro
      - ./freqtrade/user_data/strategies:/freqtrade/user_data/strategies:ro
      - ./freqtrade/user_data/logs:/freqtrade/user_data/logs
      - ./data:/freqtrade/user_data/data
      - freqtrade_paper_db:/freqtrade/user_data/db
    command: >
      trade
      --config /freqtrade/user_data/config.paper.json
      --strategy SmartCryptoSignalStrategy
      --logfile /freqtrade/user_data/logs/freqtrade-paper.log
      --db-url sqlite:////freqtrade/user_data/db/tradesv3.paper.sqlite

  qlib-worker-paper:
    build:
      context: .
      dockerfile: docker/qlib/Dockerfile
    profiles:
      - qlib
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command: python -m smartcrypto.qlib_engine.worker

  qlib-refresh-supervisor-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command:
      - python
      - scripts/docker_runtime_permissions_bootstrap.py
      - --service
      - qlib-refresh-supervisor-paper
      - --path
      - /app/data/runtime
      - --path
      - /app/data/reports
      - --path
      - /app/data/features
      - --path
      - /app/data/predictions
      - --
      - python
      - scripts/run_qlib_paper_refresh_supervisor.py
      - --interval-seconds
      - "300"

  phase14-feedback-sync-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      SMARTCRYPTO_PHASE14_OPERATIONAL_DB_PATH: /paper-db/tradesv3.paper.sqlite
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
      - freqtrade_paper_db:/paper-db:ro
    command:
      - python
      - scripts/docker_runtime_permissions_bootstrap.py
      - --service
      - phase14-feedback-sync-paper
      - --path
      - /app/data/reports
      - --path
      - /app/data/snapshots/freqtrade-paper
      - --path
      - /app/data/trades
      - --
      - python
      - scripts/run_phase14_runtime_feedback_sync.py
      - --source-db
      - /paper-db/tradesv3.paper.sqlite
      - --interval-seconds
      - "120"

  trade-event-notifications-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    profiles:
      - notifications
    user: "0:0"
    env_file:
      - .env
    depends_on:
      - freqtrade-paper
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      SMARTCRYPTO_PHASE14_OPERATIONAL_DB_PATH: /paper-db/tradesv3.paper.sqlite
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
      - freqtrade_paper_db:/paper-db:ro
    command:
      - python
      - scripts/docker_runtime_permissions_bootstrap.py
      - --service
      - trade-event-notifications-paper
      - --path
      - /app/data/reports
      - --path
      - /app/data/runtime
      - --
      - python
      - scripts/run_trade_event_notifications.py
      - --source-db
      - /paper-db/tradesv3.paper.sqlite
      - --state-db
      - /app/data/runtime/trade_event_notifications.sqlite
      - --report
      - /app/data/reports/trade_event_notifications_report.json
      - --daemon
      - --send-real
      - --channels
      - ${SMARTCRYPTO_TRADE_EVENT_NOTIFICATIONS_CHANNELS:-all}
      - --poll-seconds
      - ${SMARTCRYPTO_TRADE_EVENT_NOTIFICATIONS_POLL_SECONDS:-5}

  paper-autolearning-scheduler:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: "no"
    profiles:
      - autolearning
    user: "0:0"
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_EXCHANGE_PRIVATE_ACCESS: "false"
      SMARTCRYPTO_AUTOLEARNING_KILL_SWITCH_CONTRACT: /app/docker/paper-autolearning-scheduler/autolearning_scheduler_kill_switch.template.json
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./docker/paper-autolearning-scheduler:/app/docker/paper-autolearning-scheduler:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command:
      - python
      - scripts/docker_runtime_permissions_bootstrap.py
      - --service
      - paper-autolearning-scheduler
      - --path
      - /app/data/reports
      - --path
      - /app/data/feedback
      - --
      - python
      - scripts/run_paper_autolearning_scheduler_v1.py
      - --project-root
      - /app
      - --once
      - --write-feedback
      - --train-smoke
      - --json

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    profiles:
      - optional

volumes:
  freqtrade_paper_db:
    name: futuros_freqtrade_paper_db
