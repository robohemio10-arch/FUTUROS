services:
  smartcrypto-bot-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_DB_PATH: /app/data/sqlite/trading_dataset.sqlite
      SMARTCRYPTO_SIGNALS_PATH: /app/data/freqtrade_signals.json
      SMARTCRYPTO_PREDICTIONS_PATH: /app/data/predictions/latest_predictions.parquet
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./smartcrypto:/app/smartcrypto
    command: python -m smartcrypto.bot

  smartcrypto-dashboard-paper:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      DASHBOARD_READONLY_DEFAULT: "true"
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      SMARTCRYPTO_DB_PATH: /app/data/sqlite/trading_dataset.sqlite
      SMARTCRYPTO_SIGNALS_PATH: /app/data/freqtrade_signals.json
      SMARTCRYPTO_FREQTRADE_DB_PATH: /app/data/snapshots/freqtrade-paper/tradesv3.paper.snapshot.sqlite
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    ports:
      - "8502:8501"
    command: streamlit run smartcrypto/dashboard/app.py --server.address 0.0.0.0 --server.port 8501

  freqtrade-paper:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
    volumes:
      - ./freqtrade/user_data/config.paper.json:/freqtrade/user_data/config.paper.json:ro
      - ./freqtrade/user_data/strategies:/freqtrade/user_data/strategies:ro
      - ./freqtrade/user_data/logs:/freqtrade/user_data/logs
      - ./data:/freqtrade/user_data/data
      - freqtrade_paper_db:/freqtrade/user_data/db
    command: >
      trade
      --config /freqtrade/user_data/config.paper.json
      --strategy SmartCryptoSignalStrategy
      --logfile /freqtrade/user_data/logs/freqtrade-paper.log
      --db-url sqlite:////freqtrade/user_data/db/tradesv3.paper.sqlite

  qlib-worker-paper:
    build:
      context: .
      dockerfile: docker/qlib/Dockerfile
    profiles:
      - qlib
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./scripts:/app/scripts
      - ./smartcrypto:/app/smartcrypto
    command: python -m smartcrypto.qlib_engine.worker

  qlib-refresh-supervisor-paper:
    build:
      context: .
      dockerfile: docker/smartcrypto/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTCRYPTO_RUNTIME_MODE: paper
      LIVE_ENABLED: "false"
      ORDER_SUBMISSION_ENABLED: "false"
      REAL_ORDER_SUBMISSION_ENABLED: "false"
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./smartcrypto:/app/smartcrypto:ro
    command: python scripts/run_qlib_paper_refresh_supervisor.py --interval-seconds 300

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    profiles:
      - optional

volumes:
  freqtrade_paper_db:
    name: futuros_freqtrade_paper_db
