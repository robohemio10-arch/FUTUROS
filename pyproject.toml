[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcrypto"
version = "0.2.1"
description = "SmartCrypto starter for Binance Futures ML, Docker and Freqtrade"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
data = [
  "ccxt>=4.2,<5",
  "joblib>=1.3,<2",
  "numpy>=1.26,<2.3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<2.4",
  "pyarrow>=23.0.1,<24",
  "sqlalchemy>=2.0,<3",
  "tqdm>=4.66,<5"
]
ml = [
  "lightgbm>=4.0,<5",
  "scikit-learn>=1.4,<1.9"
]
qlib = [
  "pyqlib==0.9.7"
]
dashboard = [
  "streamlit>=1.54,<2",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<2.4",
  "pyarrow>=23.0.1,<24",
  "sqlalchemy>=2.0,<3"
]
test = [
  "pytest>=9,<10",
  "ruff>=0.11,<1",
  "mypy>=1.20,<2",
  "types-PyYAML>=6.0,<7",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<2.4",
  "pyarrow>=23.0.1,<24",
  "sqlalchemy>=2.0,<3",
  "scikit-learn>=1.4,<1.9",
  "streamlit>=1.54,<2",
  "joblib>=1.3,<2",
  "GitPython==3.1.55",
  "openpyxl>=3.1,<4",
  "tqdm>=4.66,<5",
  "lightgbm>=4.0,<5"
]
dev = [
  "pytest>=9,<10",
  "ruff>=0.11,<1",
  "mypy>=1.20,<2",
  "types-PyYAML>=6.0,<7",
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<2.4",
  "pyarrow>=23.0.1,<24",
  "sqlalchemy>=2.0,<3",
  "scikit-learn>=1.4,<1.9",
  "streamlit>=1.54,<2",
  "joblib>=1.3,<2",
  "GitPython==3.1.55",
  "openpyxl>=3.1,<4",
  "tqdm>=4.66,<5",
  "lightgbm>=4.0,<5"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smartcrypto*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
